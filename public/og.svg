<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630"
     font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <!-- The source of og.png. A social card is a raster image everywhere it is shown, so this
       file is not served: it is converted, and the PNG beside it is what the page names. -->
  <rect width="1200" height="630" fill="#0f1214"/>

  <!-- The full mark, centred. Its own drawing is centred on the origin, so it is placed by
       moving the origin. -->
  <g transform="translate(600 280) scale(4.4)">
    <rect x="-43" y="-17" width="86" height="34" rx="6"
          fill="none" stroke="#46b9aa" stroke-width="4"/>
    <text x="0" y="6" text-anchor="middle" fill="#46b9aa"
          font-size="17" font-weight="700" letter-spacing="2">ON AIR</text>
    <g fill="none" stroke="#46b9aa" stroke-width="6" stroke-linecap="round">
      <path d="M51.2 -27.2 A58 58 0 0 1 51.2 27.2"/>
      <path d="M63.6 -33.8 A72 72 0 0 1 63.6 33.8" opacity="0.5"/>
    </g>
    <g fill="none" stroke="#46b9aa" stroke-width="6" stroke-linecap="round" transform="rotate(180)">
      <path d="M51.2 -27.2 A58 58 0 0 1 51.2 27.2"/>
      <path d="M63.6 -33.8 A72 72 0 0 1 63.6 33.8" opacity="0.5"/>
    </g>
  </g>

  <text x="600" y="512" text-anchor="middle" fill="#8797a0"
        font-size="34" letter-spacing="1">Track what you watch, one shelf at a time</text>
</svg>
