<svg xmlns="http://www.w3.org/2000/svg" viewBox="-52 -52 104 104">
  <!-- The light, and the signal leaving it. The full mark in logo.svg says ON AIR around
       this; at the size of a tab or a header the words are unreadable, so only the
       broadcast survives.

       A browser cannot give a favicon a colour, so the accent is written here. It must
       match the accent in styles.css. -->
  <circle cx="0" cy="0" r="11" fill="#46b9aa"/>
  <g fill="none" stroke="#46b9aa" stroke-width="8" stroke-linecap="round">
    <path d="M16.7 -19.9 A26 26 0 0 1 16.7 19.9"/>
    <path d="M25.7 -30.6 A40 40 0 0 1 25.7 30.6" opacity="0.55"/>
  </g>
  <g fill="none" stroke="#46b9aa" stroke-width="8" stroke-linecap="round" transform="rotate(180)">
    <path d="M16.7 -19.9 A26 26 0 0 1 16.7 19.9"/>
    <path d="M25.7 -30.6 A40 40 0 0 1 25.7 30.6" opacity="0.55"/>
  </g>
</svg>
